name: Docker Build & Deploy

# Po uspesnem merge-u na main zgradi Docker sliki za backend in frontend
# ter ju potisne na Docker Hub.
# Potrebni GitHub secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  - tvoje Docker Hub uporabnisko ime
#   DOCKERHUB_TOKEN     - Docker Hub Access Token (Account Settings -> Security)

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & push images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: SmartMailBox/backend
          file: SmartMailBox/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartmailbox-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartmailbox-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: SmartMailBox/frontend
          file: SmartMailBox/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smartmailbox-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/smartmailbox-frontend:${{ github.sha }}
