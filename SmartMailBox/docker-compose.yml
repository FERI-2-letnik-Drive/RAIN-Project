services:
  mongo:
    image: mongo:7
    container_name: smartmailbox_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartmailbox_backend_container
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      # Override the .env value so the dockerized stack uses the local Mongo container
      # (self-contained system). Remove this line to use the Atlas URI from .env instead.
      - MONGODB_URI=mongodb://mongo:27017/rain-project
      # Reach the ORV face-verification service over the compose network.
      - ORV_API_URL=http://orv:3002/api/v1/face-verifications
    depends_on:
      mongo:
        condition: service_healthy
      orv:
        condition: service_started
    restart: unless-stopped

  orv:
    build:
      # ORV face-recognition project lives in a separate folder on disk.
      context: ../../../../Documents/FERI/ORV/Paketnik/ORV-Project
      dockerfile: Dockerfile
    container_name: smartmailbox_orv_container
    ports:
      - "3002:3002"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartmailbox_frontend_container
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
